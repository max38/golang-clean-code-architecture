version: '3.1'

services:

  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: golang-first-api
    ports:
      - "5432:5432"
    volumes:
      - ./data/db/:/var/lib/postgresql/data/

  mongodb:
    image: mongo:6.0.8
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: golang-first-api
    volumes:
      - ./data/mongodb/:/data/db

